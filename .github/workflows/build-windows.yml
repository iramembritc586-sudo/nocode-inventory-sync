name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 构建 exe (vite build + pkg)
        shell: pwsh
        run: npm run build:exe
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: nocode-exe
          path: nocode/nocode.exe
      - name: 发布到 Release (打标签时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nocode/nocode.exe
          name: ${{ github.ref_name }}
          body: "nocode 无代码库存同步工具 Windows 程序，双击 nocode.exe 即用（Win7-Win11）。"
